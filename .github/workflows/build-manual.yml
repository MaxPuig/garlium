# Manual Build Workflow for Multiple Platforms
# =============================================
# This workflow builds Garlium for multiple platforms (macOS, Linux, Windows).
# It is designed for manual execution only (not automatic CI).
#
# How to execute this workflow:
# 1. Go to GitHub Actions tab
# 2. Select "Manual Build - All Platforms" from the left sidebar
# 3. Click "Run workflow" dropdown
# 4. Choose the branch (typically 'master')
# 5. Click "Run workflow" button
#
# Jobs:
# - macos-arm64: Builds for Apple Silicon (macOS)
# - macos-x86_64: Builds for Intel macOS
# - linux: Builds for Linux (Ubuntu)
# - windows: Builds for Windows
# - lint: Runs code quality checks (flake8)
#
# Artifacts: Each job produces platform-specific installers uploaded as artifacts
#            that can be downloaded after successful completion.

name: Manual Build - All Platforms

# Only allow manual triggering
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build (typically master)'
        required: true
        default: 'master'
        type: choice
        options:
          - master
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  macos-arm64:
    runs-on: macos-14-arm64
    env:
      OPENSSL_DIR: "$(brew --prefix openssl@3)"
      LDFLAGS: "-L$(brew --prefix openssl@3)/lib"
      CPPFLAGS: "-I$(brew --prefix openssl@3)/include"
      PKG_CONFIG_PATH: "$(brew --prefix openssl@3)/lib/pkgconfig"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Install Homebrew dependencies
        run: |
          brew install secp256k1 openssl@3 gettext autoconf automake libtool coreutils pkgconfig
          brew link --force gettext
          ln -sf /opt/homebrew/lib/libsecp256k1.6.dylib /opt/homebrew/lib/libsecp256k1.0.dylib

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Xcode command line tools
        run: |
          xcode-select --install || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contrib/requirements/requirements.txt
          pip install -r contrib/requirements/requirements-hw.txt
          pip install -r contrib/deterministic-build/requirements-build-mac.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest electrum_grlc/tests/test_bitcoin.py -v --tb=short || true
          pytest electrum_grlc/tests/test_mnemonic.py -v --tb=short || true
          pytest electrum_grlc/tests/test_bip32.py -v --tb=short || true

      - name: Build macOS application
        run: |
          python setup.py install
          chmod +x contrib/osx/make_osx
          ./contrib/osx/make_osx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garlium-macos-arm64-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7

  macos-x86_64:
    runs-on: macos-14
    env:
      OPENSSL_DIR: "$(brew --prefix openssl@3)"
      LDFLAGS: "-L$(brew --prefix openssl@3)/lib"
      CPPFLAGS: "-I$(brew --prefix openssl@3)/include"
      PKG_CONFIG_PATH: "$(brew --prefix openssl@3)/lib/pkgconfig"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Install Homebrew dependencies
        run: |
          brew install secp256k1 openssl@3 gettext autoconf automake libtool coreutils pkgconfig
          brew link --force gettext
          # On Intel macOS, libsecp256k1 is installed to /usr/local/lib
          if [ -d "/usr/local/lib" ]; then
            ln -sf /usr/local/lib/libsecp256k1.6.dylib /usr/local/lib/libsecp256k1.0.dylib
          fi

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Xcode command line tools
        run: |
          xcode-select --install || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contrib/requirements/requirements.txt
          pip install -r contrib/requirements/requirements-hw.txt
          pip install -r contrib/deterministic-build/requirements-build-mac.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest electrum_grlc/tests/test_bitcoin.py -v --tb=short || true
          pytest electrum_grlc/tests/test_mnemonic.py -v --tb=short || true
          pytest electrum_grlc/tests/test_bip32.py -v --tb=short || true

      - name: Build macOS application
        run: |
          python setup.py install
          chmod +x contrib/osx/make_osx
          ./contrib/osx/make_osx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garlium-macos-x86_64-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contrib/requirements/requirements.txt
          pip install -r contrib/requirements/requirements-hw.txt
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev

      - name: Ensure libsecp256k1 soname
        run: |
          # Make a compatible soname available for loaders that expect .so.0
          LIB=$(ldconfig -p | awk '/libsecp256k1/ {print $4; exit}')
          if [ -n "$LIB" ]; then
            sudo ln -sf "$LIB" /usr/lib/libsecp256k1.so.0 || true
            sudo ln -sf "$LIB" /usr/lib/libsecp256k1.so || true
          fi

      - name: Run tests
        run: |
          pip install pytest
          pytest electrum_grlc/tests/ -v --tb=short || true

      - name: Build Linux application
        run: |
          python setup.py install

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garlium-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r contrib/requirements/requirements.txt
          python -m pip install -r contrib/requirements/requirements-hw.txt
          python -m pip install -r contrib/deterministic-build/requirements-build-wine.txt

      - name: Run tests
        run: |
          pip install pytest
          pytest electrum_grlc/tests/ -v --tb=short || true

      - name: Build Windows application
        run: |
          python setup.py install
          # Note: Windows builds require Wine environment which is not available on GitHub Actions
          # For Windows builds, please use the Docker-based approach described in contrib/build-wine/README.md
          echo "Windows builds require Wine environment. Use local Docker build instead."
          echo "See: contrib/build-wine/README.md"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garlium-windows-${{ github.sha }}
          path: |
            contrib/build-wine/dist/*.exe
            dist/*.exe
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 mandatory
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run flake8 non-mandatory
        run: |
          flake8 . --count --select=E,F,W,C90 --show-source --statistics || true
